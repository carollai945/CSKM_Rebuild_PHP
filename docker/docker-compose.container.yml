services:
  mysql:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root_password_change_me}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-cskm_prod}
      MYSQL_USER: ${MYSQL_USER:-cskm_user}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-cskm_password_change_me}
    command: --default-authentication-plugin=mysql_native_password
    volumes:
      - mysql_data:/var/lib/mysql
    ports:
      - "${MYSQL_PORT:-3306}:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-p$$MYSQL_ROOT_PASSWORD"]
      interval: 10s
      timeout: 5s
      retries: 12

  backend:
    build:
      context: ..
      dockerfile: docker/backend/Dockerfile
    restart: unless-stopped
    working_dir: /var/www/backend
    volumes:
      - ../backend:/var/www/backend
    depends_on:
      mysql:
        condition: service_healthy
    command: php-fpm

  queue:
    build:
      context: ..
      dockerfile: docker/backend/Dockerfile
    restart: unless-stopped
    working_dir: /var/www/backend
    volumes:
      - ../backend:/var/www/backend
    depends_on:
      mysql:
        condition: service_healthy
      backend:
        condition: service_started
    command: php artisan queue:work --sleep=3 --tries=3 --timeout=90

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_started
    ports:
      - "${APP_PORT:-8080}:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ../frontend/dist:/var/www/frontend/dist:ro
      - ../backend/public:/var/www/backend/public:ro

  frontend_builder:
    image: node:20-alpine
    working_dir: /var/www/frontend
    volumes:
      - ../frontend:/var/www/frontend
    command: sh -c "npm ci && npm run build"
    profiles: ["build"]

volumes:
  mysql_data:
